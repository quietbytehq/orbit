# Continuous integration for Orbit.
#
# check:          Linux. svelte-check, vitest, clippy, and cargo test (unit + integration tests
#                 against a real rclone fetched by scripts/fetch-rclone.sh).
# bundle-linux:   Linux. AppImage and .deb, uploaded as artifacts.
# bundle-windows: Windows. .msi, uploaded as an artifact. Also runs the Rust tests and reports
#                 the per-test results in the job summary without failing the job.
# snap-linux:     Linux. Builds the snap from the .deb (snapcraft, strict confinement), installs
#                 it on the runner, connects its interfaces and runs the launch-and-quit smoke
#                 test against /snap/bin/orbit. Uploads the .snap as an artifact.
# release:        Only for a pushed tag v*. Creates the GitHub Release and attaches the AppImage,
#                 .deb, .snap and .msi from the bundle jobs, once the check jobs are green.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file unzip \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev \
            fuse3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch rclone (sidecar used by the integration tests)
        run: scripts/fetch-rclone.sh

      - name: svelte-check
        run: npm run check

      - name: Frontend tests
        run: npm test

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

  # Launches the real app twice under a virtual display: the second launch must hand over and
  # exit, and `--quit` must stop rclone and end the process (scripts/smoke-quit.sh).
  smoke-linux:
    name: Smoke (single instance, clean quit)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file unzip \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev \
            xvfb dbus-x11 procps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: smoke

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch rclone
        run: scripts/fetch-rclone.sh

      - name: Build the app (debug, no bundle)
        run: npm run tauri build -- --debug --no-bundle

      - name: Single instance and clean quit
        run: scripts/smoke-quit.sh src-tauri/target/debug/orbit

  bundle-linux:
    name: Bundle (Linux AppImage + deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file unzip \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: bundle

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch rclone
        run: scripts/fetch-rclone.sh

      - name: Build AppImage and deb
        run: npm run tauri build -- --bundles appimage,deb

      - name: Rename bundles to orbit_*
        run: npm run bundle:rename

      - name: List bundles
        run: find src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  snap-linux:
    name: Snap (build, install, launch)
    needs: [bundle-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: orbit-linux-x86_64
          path: artifact

      - name: Place the deb where snapcraft.yaml expects it
        run: |
          mkdir -p dist
          cp artifact/deb/*.deb dist/
          ls -la dist

      - name: Build the snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Install the snap and connect its interfaces
        run: |
          sudo snap install --dangerous "${{ steps.snapcraft.outputs.snap }}"
          for plug in network network-bind home removable-media fuse-support desktop desktop-legacy wayland x11 unity7 gsettings opengl; do
            sudo snap connect "orbit:$plug" || echo "could not connect $plug (may be auto-connected or unavailable here)"
          done
          snap connections orbit || true

      - name: Install tools for the launch test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11 procps

      # Informational: what the confined app sees. (Library lookups here lack the launch-time
      # environment, so a "not found" is a hint, not a verdict; the launch below is the test.)
      - name: Look inside the snap
        run: |
          sudo snap run --shell orbit -c '
            echo "HOME=$HOME SNAP=$SNAP"
            ls -la "$SNAP/usr/bin"
            ldd "$SNAP/usr/bin/orbit" 2>&1 | grep "not found" || echo "all libraries resolve"
            "$SNAP/usr/bin/rclone" version | head -1
          ' || true

      # Runs as root: snap-confine needs the app in a snapd-tracked cgroup (core24 + fuse-support
      # set up a device cgroup), and `snap run` can only create one over the system bus here,
      # which it falls back to for root only. The script's dbus-run-session has no systemd --user.
      - name: Launch twice and quit (smoke test against the snap)
        run: sudo -E scripts/smoke-quit.sh /snap/bin/orbit

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-snap
          if-no-files-found: error
          path: ${{ steps.snapcraft.outputs.snap }}

  bundle-windows:
    name: Bundle (Windows msi) and Rust tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch rclone
        run: npm run fetch:rclone:windows

      - name: Build msi
        run: npm run tauri build -- --bundles msi

      - name: Rename bundles to orbit_*
        run: npm run bundle:rename

      - name: List bundles
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle/msi -Filter *.msi | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-x86_64
          if-no-files-found: error
          path: src-tauri/target/release/bundle/msi/*.msi

      # The Rust tests run against the Windows rclone fetched above. Results are reported in the
      # job summary. This step does not fail the job: Windows has no FUSE and no WinFsp on the
      # runner, so mount tests skip, and anything else that fails is reported for a human to read.
      - name: Rust tests (report only)
        id: rust-tests
        shell: pwsh
        continue-on-error: true
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1 | Tee-Object -FilePath rust-tests-windows.log
          exit $LASTEXITCODE

      - name: Summarize Windows test results
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path rust-tests-windows.log)) {
            "## Rust tests on Windows`n`nThe test step did not run (an earlier step failed)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          $log = Get-Content rust-tests-windows.log -Raw
          $lines = $log -split "`r?`n"
          $results = $lines | Where-Object { $_ -match '^test \S+ \.\.\. (ok|FAILED|ignored)' }
          $summary = $lines | Where-Object { $_ -match '^test result:' }
          $out = @()
          $out += "## Rust tests on Windows"
          $out += ""
          $out += "Outcome of the cargo test step: **${{ steps.rust-tests.outcome }}**"
          $out += ""
          $out += "| Test | Result |"
          $out += "|---|---|"
          foreach ($line in $results) {
            if ($line -match '^test (\S+) \.\.\. (\S+)') { $out += "| ``$($Matches[1])`` | $($Matches[2]) |" }
          }
          $out += ""
          $out += '```'
          $out += $summary
          $out += '```'
          $out -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-tests-windows-log
          path: rust-tests-windows.log
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, smoke-linux, bundle-linux, snap-linux, bundle-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: orbit-*
          path: dist
          merge-multiple: true

      - name: List release files
        run: find dist -type f | sort

      - name: Create the release and attach the bundles
        uses: softprops/action-gh-release@v2
        with:
          name: Orbit ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.snap
            dist/**/*.msi
